version: 1
intents:
  cover:
    describes: An opening slide.
    slides:
      - {component: cover}
  quote:
    describes: A quotation with its attribution.
    slides:
      - {component: quote}
  statement:
    describes: One claim, stated large.
    slides:
      - {component: statement}
  bullets:
    describes: A list of points.
    slides:
      - {component: bullets}
  body:
    describes: Running prose in paragraphs.
    doc:
      - {component: body}
  callout:
    describes: Points set apart from the running text.
    doc:
      - {component: callout}
  agenda:
    describes: A numbered list of topics.
    slides:
      - {component: agenda}
  comparison:
    describes: A comparison of options.
    slides:
      - {component: comparison, when: {count: [2, 3]}}
      - {component: two-column}
  key-numbers:
    describes: Key figures and their captions.
    slides:
      - {component: key-figures, when: {count: [3, 4]}}
      - {component: bullets}
  table:
    describes: Tabular data with headings and rows.
    slides:
      - {component: table, when: {has_data: true}}
      - {component: bullets}
  chronology:
    describes: Events in chronological order.
    slides:
      - {component: timeline}
  people:
    describes: People and their roles.
    slides:
      - {component: people}
  contact:
    describes: Contact details.
    slides:
      - {component: contact}
  parallel-set:
    describes: Related items presented together.
    slides:
      - {component: cards, when: {count: [2, 4]}}
      - {component: bullets}
