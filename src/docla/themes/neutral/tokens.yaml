schema: 1

colour:
  roles:
    ink: "#1A1A1A"
    ink-soft: "#4A4F55"
    muted: "#6B6B6B"
    surface: "#FFFFFF"
    surface-alt: "#F2F3F4"
    accent: "#2F5D8A"
    hairline: "#D5D8DB"
    on-dark: "#FFFFFF"
    dark: "#1A1A1A"
  chart:
    sequence: ["#1A1A1A", "#4A4F55", "#8A9096", "#D5D8DB"]
    categorical: ["#2F5D8A", "#7A4DFF", "#00A37A", "#E0A100", "#C2410C", "#6B7280"]
  usage:
    text: [ink, ink-soft, muted, on-dark, accent]
    fill: [surface, surface-alt, dark, accent]
    stroke: [hairline, ink-soft, accent]
  contrast_min: 4.5

type:
  families:
    display:
      name: Source Serif 4
      files: [SourceSerif4-Regular.ttf, SourceSerif4-Semibold.ttf]
    text:
      name: Inter
      files: [Inter-Regular.ttf, Inter-SemiBold.ttf]
  scale:
    slides:
      title: {family: display, size: 32, weight: 600}
      subtitle: {family: text, size: 24}
      body: {family: text, size: 20, leading: 1.3}
      caption: {family: text, size: 18}
      figure: {family: display, size: 48, weight: 600}
      label: {family: text, size: 18}
      min_size: 18
    doc:
      h1: {family: display, size: 16, weight: 600}
      h2: {family: display, size: 13, weight: 600}
      body: {family: text, size: 11, leading: 1.35}
      caption: {family: text, size: 9}
      min_size: 9

pages:
  slides:
    width: 960pt
    height: 540pt
    margin: {top: 40pt, right: 40pt, bottom: 40pt, left: 40pt}
  doc:
    size: a4
    margin: {top: 20mm, right: 20mm, bottom: 20mm, left: 20mm}
    columns: 1

# Spacing.unit is a number in points.
spacing:
  unit: 4
  scale: [1, 2, 3, 4, 6, 8, 12, 16]
