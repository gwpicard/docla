name: Bug report
description: Report something that does not work as expected
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the defect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that trigger the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe what should have happened.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of docla is affected?
      options:
        - model
        - source
        - theme
        - render
        - facts
        - checks
        - loop
        - learn
        - ingest
        - agents
        - server
        - web
        - ci
        - docs
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly does this affect work?
      options:
        - blocker
        - major
        - minor
    validations:
      required: true
