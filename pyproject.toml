[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doclo"
version = "0.0.1"
description = "Claude-generated branded slides and documents (PDF) with a self-healing rulebook. Early development."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Guillaume Picard" }]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Repository = "https://github.com/gwpicard/doclo"

[tool.hatch.build.targets.wheel]
packages = ["src/doclo"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
